[project]
name = "finance-portfolio"
version = "0.1.0"
description = "Five finance automation projects: comps, variance, LBO, deal sourcing, KPI dashboard"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pydantic>=2.6",
    "openpyxl>=3.1",
    "typer>=0.12",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "scipy>=1.12",
]

[project.optional-dependencies]
live = ["edgartools>=4.0", "yfinance>=0.2"]
dash = ["plotly>=5.20"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
