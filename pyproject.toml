[project]
name = "finance-portfolio"
version = "0.1.0"
description = "Five finance automation projects: comps, variance, LBO, deal sourcing, KPI dashboard"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pydantic>=2.6",
    "openpyxl>=3.1",
    "typer>=0.12",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "scipy>=1.12",
]

[project.optional-dependencies]
live = ["yfinance>=0.2"]
dash = ["plotly>=5.20"]
dev = ["pytest>=8.0", "ruff>=0.5"]
app = ["streamlit>=1.65", "plotly>=5.20", "yfinance>=0.2"]
screenshots = ["playwright>=1.44"]
# Filing Tone (PyTorch). Not in requirements.txt or the Docker image: the app reads a committed snapshot.
ml = ["torch>=2.3", "transformers>=4.44", "datasets>=2.20", "scikit-learn>=1.4"]

[tool.setuptools.packages.find]
include = ["finlib*", "projects*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Pin the classic default set so a newer ruff does not change what "clean" means.
select = ["E4", "E7", "E9", "F"]
# House style: `ws.cell(...); r += 1` one-liners, O/D sheet maps, small lambda formatters.
ignore = ["E702", "E741", "E731"]
