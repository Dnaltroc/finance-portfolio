apiVersion: apps/v1
kind: Deployment
metadata:
  name: finance-portfolio
  labels: { app: finance-portfolio }
spec:
  replicas: 2
  selector:
    matchLabels: { app: finance-portfolio }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }   # never drop below 2 pods during a deploy
  template:
    metadata:
      labels: { app: finance-portfolio }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: app
          image: finance-portfolio
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8501 }
          envFrom:
            # Optional: kubectl -n finance-portfolio create secret generic finance-portfolio-secrets --from-env-file=.env
            # Without it the app runs offline on the bundled fixtures.
            - secretRef: { name: finance-portfolio-secrets, optional: true }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          startupProbe:
            httpGet: { path: /_stcore/health, port: http }
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet: { path: /_stcore/health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /_stcore/health, port: http }
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: work, mountPath: /work }   # SQLite cache
            - { name: tmp, mountPath: /tmp }     # Excel downloads are built in a temp dir
      volumes:
        - { name: work, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
